<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Acide Benzoïque — AR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;font-family:sans-serif;}
#ui{position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(8,8,25,0.85);
  color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
  backdrop-filter:blur(8px);}
#ui h1{font-size:14px;font-weight:500;}
#ui span{font-size:11px;color:rgba(255,255,255,0.5);}
#status{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(8,8,25,0.8);color:rgba(255,255,255,0.75);font-size:12px;
  padding:8px 18px;border-radius:20px;z-index:9999;pointer-events:none;
  border:0.5px solid rgba(255,255,255,0.15);white-space:nowrap;}
</style>
</head>
<body>
<div id="ui">
  <h1>⬡ Acide Benzoïque — C&#x2087;H&#x2086;O&#x2082;</h1>
  <span>Pointez vers votre marqueur</span>
</div>
<div id="status">Initialisation caméra…</div>

<a-scene
  vr-mode-ui="enabled:false"
  embedded
  arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono; patternRatio:0.75;"
  renderer="logarithmicDepthBuffer:true; antialias:true;"
>
  <a-assets>
    <a-asset-item id="patt" src="molecule_marker.patt"></a-asset-item>
  </a-assets>

  <a-marker type="pattern" url="molecule_marker.patt" id="marker"
    smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2"
    emitevents="true">

    <!-- ACIDE BENZOÏQUE — cycle benzénique centré sur le marqueur -->
    <!-- Carbones du cycle -->
    <a-sphere position="0.35 0.3 0"    radius="0.085" color="#888888" roughness="0.3" metalness="0.2"></a-sphere>
    <a-sphere position="0.175 0.60 0"  radius="0.085" color="#888888" roughness="0.3" metalness="0.2"></a-sphere>
    <a-sphere position="-0.175 0.60 0" radius="0.085" color="#888888" roughness="0.3" metalness="0.2"></a-sphere>
    <a-sphere position="-0.35 0.3 0"   radius="0.085" color="#888888" roughness="0.3" metalness="0.2"></a-sphere>
    <a-sphere position="-0.175 0 0"    radius="0.085" color="#888888" roughness="0.3" metalness="0.2"></a-sphere>
    <a-sphere position="0.175 0 0"     radius="0.085" color="#888888" roughness="0.3" metalness="0.2"></a-sphere>

    <!-- Groupement COOH -->
    <a-sphere position="0.71 0.3 0"    radius="0.085" color="#888888" roughness="0.3" metalness="0.2"></a-sphere>
    <a-sphere position="0.865 0.57 0"  radius="0.082" color="#e03030" roughness="0.3" metalness="0.1"></a-sphere>
    <a-sphere position="0.865 0.03 0"  radius="0.082" color="#e03030" roughness="0.3" metalness="0.1"></a-sphere>
    <a-sphere position="1.095 0.03 0"  radius="0.055" color="#ccccff" roughness="0.5"></a-sphere>

    <!-- H sur le cycle -->
    <a-sphere position="0.62 0.3 0"    radius="0.000" color="#ccccff"></a-sphere>
    <a-sphere position="0.31 0.87 0"   radius="0.055" color="#ccccff" roughness="0.5"></a-sphere>
    <a-sphere position="-0.31 0.87 0"  radius="0.055" color="#ccccff" roughness="0.5"></a-sphere>
    <a-sphere position="-0.62 0.3 0"   radius="0.055" color="#ccccff" roughness="0.5"></a-sphere>
    <a-sphere position="-0.31 -0.27 0" radius="0.055" color="#ccccff" roughness="0.5"></a-sphere>
    <a-sphere position="0.31 -0.27 0"  radius="0.055" color="#ccccff" roughness="0.5"></a-sphere>

    <!-- Liaisons cycle (1.5) - deux cylindres fins -->
    <a-cylinder position="0.2625 0.45 0"  radius="0.016" height="0.33" color="#aaaaaa" rotation="0 0 60"></a-cylinder>
    <a-cylinder position="0.276 0.44 0"   radius="0.010" height="0.30" color="#777777" rotation="0 0 60"></a-cylinder>
    <a-cylinder position="0 0.60 0"       radius="0.016" height="0.36" color="#aaaaaa" rotation="0 0 0"></a-cylinder>
    <a-cylinder position="0.012 0.60 0"   radius="0.010" height="0.33" color="#777777" rotation="0 0 0"></a-cylinder>
    <a-cylinder position="-0.2625 0.45 0" radius="0.016" height="0.33" color="#aaaaaa" rotation="0 0 -60"></a-cylinder>
    <a-cylinder position="-0.264 0.44 0"  radius="0.010" height="0.30" color="#777777" rotation="0 0 -60"></a-cylinder>
    <a-cylinder position="-0.2625 0.15 0" radius="0.016" height="0.33" color="#aaaaaa" rotation="0 0 60"></a-cylinder>
    <a-cylinder position="-0.276 0.16 0"  radius="0.010" height="0.30" color="#777777" rotation="0 0 60"></a-cylinder>
    <a-cylinder position="0 0 0"          radius="0.016" height="0.36" color="#aaaaaa" rotation="0 0 0"></a-cylinder>
    <a-cylinder position="0.012 0 0"      radius="0.010" height="0.33" color="#777777" rotation="0 0 0"></a-cylinder>
    <a-cylinder position="0.2625 0.15 0"  radius="0.016" height="0.33" color="#aaaaaa" rotation="0 0 -60"></a-cylinder>
    <a-cylinder position="0.264 0.16 0"   radius="0.010" height="0.30" color="#777777" rotation="0 0 -60"></a-cylinder>

    <!-- Liaison C0-C(carboxyle) simple -->
    <a-cylinder position="0.5325 0.3 0"  radius="0.018" height="0.37" color="#aaaaaa" rotation="0 0 90"></a-cylinder>
    <!-- C=O double -->
    <a-cylinder position="0.788 0.435 0" radius="0.016" height="0.30" color="#dd4444" rotation="0 0 -62"></a-cylinder>
    <a-cylinder position="0.800 0.425 0" radius="0.010" height="0.27" color="#aa2222" rotation="0 0 -62"></a-cylinder>
    <!-- C-OH simple -->
    <a-cylinder position="0.788 0.165 0" radius="0.016" height="0.28" color="#dd4444" rotation="0 0 62"></a-cylinder>
    <!-- O-H -->
    <a-cylinder position="0.98 0.03 0"   radius="0.013" height="0.23" color="#9999cc" rotation="0 0 90"></a-cylinder>

    <!-- H cycle liaisons -->
    <a-cylinder position="0.465 0.585 0"  radius="0.013" height="0.27" color="#9999cc" rotation="0 0 -30"></a-cylinder>
    <a-cylinder position="0.31 0.735 0"   radius="0.013" height="0.27" color="#9999cc" rotation="0 0 -15"></a-cylinder>
    <a-cylinder position="-0.31 0.735 0"  radius="0.013" height="0.27" color="#9999cc" rotation="0 0 15"></a-cylinder>
    <a-cylinder position="-0.485 0.3 0"   radius="0.013" height="0.27" color="#9999cc" rotation="0 0 90"></a-cylinder>
    <a-cylinder position="-0.31 -0.135 0" radius="0.013" height="0.27" color="#9999cc" rotation="0 0 -15"></a-cylinder>
    <a-cylinder position="0.31 -0.135 0"  radius="0.013" height="0.27" color="#9999cc" rotation="0 0 15"></a-cylinder>

    <!-- Label flottant -->
    <a-text value="Acide Benzoique  C7H6O2" position="-0.3 1.05 0"
      scale="0.5 0.5 0.5" color="white" align="left"></a-text>
    <a-text value="C gris  O rouge  H blanc" position="-0.3 0.90 0"
      scale="0.33 0.33 0.33" color="#aaccff" align="left"></a-text>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const st = document.getElementById('status');
  const mk = document.getElementById('marker');
  mk.addEventListener('markerFound', () => {
    st.textContent = '✓ Molécule détectée !';
    st.style.color = '#88ee88';
    st.style.borderColor = 'rgba(100,220,100,0.4)';
  });
  mk.addEventListener('markerLost', () => {
    st.textContent = 'Pointez vers votre marqueur hexagonal';
    st.style.color = 'rgba(255,255,255,0.75)';
    st.style.borderColor = 'rgba(255,255,255,0.15)';
  });
  setTimeout(() => { st.textContent = 'Pointez vers votre marqueur hexagonal'; }, 2500);
</script>
</body>
</html>
